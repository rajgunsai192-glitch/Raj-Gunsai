<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bgLight: '#f8fafd',
                            bgDark: '#131314',
                            sidebarLight: '#f0f4f9',
                            sidebarDark: '#1e1f20',
                            cardLight: '#ffffff',
                            cardDark: '#28292a',
                            accent: '#1a73e8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        /* Mobile viewport height fix */
        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        html {
            height: -webkit-fill-available;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        /* Markdown Rendering Styles */
        .prose pre {
            background-color: #1e1e1e !important;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            overflow-x: auto;
        }
        .prose code {
            font-family: monospace;
            font-size: 0.875rem;
        }
        .prose p {
            margin-bottom: 0.75rem;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gemini-bgLight dark:bg-gemini-bgDark text-gray-800 dark:text-gray-200 antialiased h-full flex flex-col">

    <!-- FALLBACK LOADING SCREEN -->
    <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white dark:bg-gemini-bgDark text-gray-600 dark:text-gray-300">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-lg font-medium">Initializing Universal AI Interface...</p>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="hidden flex-1 flex overflow-hidden relative h-full">

        <!-- MOBILE SIDEBAR OVERLAY -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-gemini-sidebarLight dark:bg-gemini-sidebarDark transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between border-r border-gray-200 dark:border-gray-800">
            <div class="p-4 flex flex-col h-full overflow-hidden">
                <!-- Top actions -->
                <div class="flex items-center justify-between mb-4">
                    <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-gemini-cardDark hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 py-3 px-4 rounded-full shadow-sm border border-gray-200 dark:border-gray-700 transition">
                        <i class="fa-solid fa-plus text-blue-500"></i>
                        <span class="font-medium text-sm">New Chat</span>
                    </button>
                    <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <!-- Chat list -->
                <div class="flex-1 overflow-y-auto space-y-1 pr-1" id="chat-list">
                    <!-- Dynamic Chat items -->
                </div>

                <!-- Bottom Config Actions -->
                <div class="pt-4 border-t border-gray-200 dark:border-gray-700 space-y-2">
                    <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">
                        <i class="fa-solid fa-gear text-base w-5 text-center"></i>
                        <span>Settings</span>
                    </button>
                    <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">
                        <i id="theme-icon" class="fa-solid fa-moon text-base w-5 text-center"></i>
                        <span id="theme-text">Dark Mode</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN VIEWPORT AREA -->
        <main class="flex-1 flex flex-col min-w-0 h-full relative">
            
            <!-- HEADER -->
            <header class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 bg-gemini-bgLight dark:bg-gemini-bgDark z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 p-2">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <span id="active-chat-title" class="font-semibold text-gray-800 dark:text-gray-200 truncate max-w-[200px] sm:max-w-xs">New Chat</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="active-model-badge" class="text-xs bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 px-2.5 py-1 rounded-full font-mono">
                        deepseek/deepseek-r1:free
                    </span>
                </div>
            </header>

            <!-- MESSAGES CONTAINER -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
                <!-- Dynamic Messages Rendered Here -->
            </div>

            <!-- CHAT INPUT AREA -->
            <div class="p-3 sm:p-4 max-w-4xl w-full mx-auto bg-transparent">
                <form id="chat-form" onsubmit="handleSend(event)" class="relative flex items-center bg-white dark:bg-gemini-cardDark rounded-2xl shadow-md border border-gray-200 dark:border-gray-700 px-4 py-2">
                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="Message Gemini..." 
                        class="w-full resize-none border-0 bg-transparent text-gray-800 dark:text-gray-100 focus:ring-0 focus:outline-none pr-12 max-h-32 min-h-[40px] py-2"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResizeTextarea(this)"></textarea>
                    <button 
                        type="submit" 
                        id="send-btn"
                        class="absolute right-3 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gemini-cardDark rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Settings</h3>
                <button onclick="closeSettings()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" id="setting-api-key" placeholder="sk-or-v1-..." class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gemini-sidebarDark text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">Model Name</label>
                    <input type="text" id="setting-model" placeholder="deepseek/deepseek-r1:free" class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gemini-sidebarDark text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1">Global System Prompt</label>
                    <textarea id="setting-system-prompt" rows="3" placeholder="You are a helpful AI assistant..." class="w-full p-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gemini-sidebarDark text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition text-sm">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition text-sm font-medium">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT SECTION (SAFE PLACEMENT) -->
    <script>
        // State Management
        let state = {
            apiKey: '',
            model: 'deepseek/deepseek-r1:free',
            systemPrompt: 'You are a helpful, concise, and accurate AI assistant.',
            darkMode: false,
            chats: [],
            activeChatId: null,
            isGenerating: false
        };

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadLocalStorage();
            initTheme();
            
            // Setup markdown parser configuration
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                langPrefix: 'hljs language-'
            });

            if (state.chats.length === 0) {
                createNewChat(false);
            } else if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
                state.activeChatId = state.chats[0].id;
            }

            renderSidebar();
            renderMessages();
            updateUIState();

            // Hide Loading Screen safely
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        });

        // Local Storage Persistence
        function loadLocalStorage() {
            try {
                state.apiKey = localStorage.getItem('ai_chat_api_key') || '';
                state.model = localStorage.getItem('ai_chat_model') || 'deepseek/deepseek-r1:free';
                state.systemPrompt = localStorage.getItem('ai_chat_system_prompt') || 'You are a helpful, concise, and accurate AI assistant.';
                state.darkMode = JSON.parse(localStorage.getItem('ai_chat_dark_mode') || 'false');
                state.chats = JSON.parse(localStorage.getItem('ai_chat_history') || '[]');
                state.activeChatId = localStorage.getItem('ai_chat_active_id') || null;
            } catch (e) {
                console.error("Failed to parse LocalStorage Data", e);
            }
        }

        function saveLocalStorage() {
            try {
                localStorage.setItem('ai_chat_api_key', state.apiKey);
                localStorage.setItem('ai_chat_model', state.model);
                localStorage.setItem('ai_chat_system_prompt', state.systemPrompt);
                localStorage.setItem('ai_chat_dark_mode', JSON.stringify(state.darkMode));
                localStorage.setItem('ai_chat_history', JSON.stringify(state.chats));
                if (state.activeChatId) {
                    localStorage.setItem('ai_chat_active_id', state.activeChatId);
                }
            } catch (e) {
                console.error("Failed to save state to LocalStorage", e);
            }
        }

        // Theme Toggle Handler
        function initTheme() {
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-base w-5 text-center';
                document.getElementById('theme-text').textContent = 'Light Mode';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon text-base w-5 text-center';
                document.getElementById('theme-text').textContent = 'Dark Mode';
            }
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            initTheme();
            saveLocalStorage();
        }

        // Sidebar Navigation Handling
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Settings Modal Handling
        function openSettings() {
            document.getElementById('setting-api-key').value = state.apiKey;
            document.getElementById('setting-model').value = state.model;
            document.getElementById('setting-system-prompt').value = state.systemPrompt;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            state.apiKey = document.getElementById('setting-api-key').value.trim();
            state.model = document.getElementById('setting-model').value.trim() || 'deepseek/deepseek-r1:free';
            state.systemPrompt = document.getElementById('setting-system-prompt').value.trim();
            saveLocalStorage();
            updateUIState();
            closeSettings();
        }

        function updateUIState() {
            document.getElementById('active-model-badge').textContent = state.model;
            const activeChat = getActiveChat();
            document.getElementById('active-chat-title').textContent = activeChat ? activeChat.title : 'New Chat';
        }

        // Chat Data Operations
        function createNewChat(triggerRender = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Chat',
                messages: []
            };
            state.chats.unshift(newChat);
            state.activeChatId = newChat.id;
            saveLocalStorage();

            if (triggerRender) {
                renderSidebar();
                renderMessages();
                updateUIState();
                if (window.innerWidth < 768) {
                    toggleSidebar();
                }
            }
        }

        function getActiveChat() {
            return state.chats.find(c => c.id === state.activeChatId) || null;
        }

        function switchChat(id) {
            state.activeChatId = id;
            saveLocalStorage();
            renderSidebar();
            renderMessages();
            updateUIState();
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.activeChatId === id) {
                state.activeChatId = state.chats.length > 0 ? state.chats[0].id : null;
            }
            if (state.chats.length === 0) {
                createNewChat(false);
            }
            saveLocalStorage();
            renderSidebar();
            renderMessages();
            updateUIState();
        }

        function renameChat(id, event) {
            event.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (!chat) return;
            const newTitle = prompt('Rename Chat:', chat.title);
            if (newTitle && newTitle.trim() !== '') {
                chat.title = newTitle.trim();
                saveLocalStorage();
                renderSidebar();
                updateUIState();
            }
        }

        // Dynamic Render Methods
        function renderSidebar() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';

            state.chats.forEach(chat => {
                const isActive = chat.id === state.activeChatId;
                const div = document.createElement('div');
                div.onclick = () => switchChat(chat.id);
                div.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer text-sm transition ${
                    isActive 
                    ? 'bg-blue-100/70 dark:bg-gray-800 text-blue-700 dark:text-blue-400 font-medium' 
                    : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gray-800/60'
                }`;

                div.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate mr-2">
                        <i class="fa-regular fa-message text-xs opacity-70"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <div class="hidden group-hover:flex items-center gap-1">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 hover:text-blue-600 dark:hover:text-blue-400 text-gray-500">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 hover:text-red-600 dark:hover:text-red-400 text-gray-500">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const activeChat = getActiveChat();
            if (!activeChat || activeChat.messages.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400 dark:text-gray-500 my-auto">
                        <i class="fa-solid fa-sparkles text-4xl mb-4 text-blue-500/50"></i>
                        <h2 class="text-2xl font-semibold mb-2 text-gray-700 dark:text-gray-300">How can I help you today?</h2>
                        <p class="text-sm max-w-sm">Type a message below to start a conversation with ${state.model}.</p>
                    </div>
                `;
                return;
            }

            activeChat.messages.forEach((msg, idx) => {
                appendMessageToUI(msg.role, msg.content, idx);
            });

            scrollToBottom();
        }

        function appendMessageToUI(role, content, index) {
            const container = document.getElementById('messages-container');
            const isUser = role === 'user';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;
            msgDiv.id = `msg-item-${index}`;

            const innerBox = document.createElement('div');
            innerBox.className = `max-w-[88%] sm:max-w-[80%] rounded-2xl px-4 py-3 ${
                isUser 
                ? 'bg-blue-600 text-white rounded-br-none' 
                : 'bg-white dark:bg-gemini-cardDark border border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-100 rounded-bl-none shadow-sm'
            }`;

            if (isUser) {
                innerBox.textContent = content;
            } else {
                innerBox.className += ' prose dark:prose-invert max-w-none text-sm sm:text-base';
                innerBox.innerHTML = marked.parse(content || '');
            }

            msgDiv.appendChild(innerBox);
            container.appendChild(msgDiv);
        }

        // Textarea Layout Helpers
        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 128) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit'));
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            container.scrollTop = container.scrollHeight;
        }

        // OpenRouter API Streaming Logic
        async function handleSend(e) {
            if (e) e.preventDefault();
            if (state.isGenerating) return;

            const inputEl = document.getElementById('user-input');
            const promptText = inputEl.value.trim();
            if (!promptText) return;

            if (!state.apiKey) {
                alert('Please enter your OpenRouter API Key in Settings first!');
                openSettings();
                return;
            }

            const activeChat = getActiveChat();
            if (!activeChat) return;

            // Auto-generate title if this is the first message
            if (activeChat.messages.length === 0) {
                activeChat.title = promptText.length > 25 ? promptText.substring(0, 25) + '...' : promptText;
                renderSidebar();
                updateUIState();
            }

            // Append User Message
            activeChat.messages.push({ role: 'user', content: promptText });
            inputEl.value = '';
            autoResizeTextarea(inputEl);

            // Append Placeholder AI Message
            activeChat.messages.push({ role: 'assistant', content: '' });
            saveLocalStorage();
            renderMessages();

            const aiMessageIndex = activeChat.messages.length - 1;
            const targetElement = document.querySelector(`#msg-item-${aiMessageIndex} > div`);
            
            state.isGenerating = true;
            toggleSendButtonState(true);

            // Build Payloads
            const apiMessages = [];
            if (state.systemPrompt) {
                apiMessages.push({ role: 'system', content: state.systemPrompt });
            }
            activeChat.messages.slice(0, -1).forEach(m => {
                apiMessages.push({ role: m.role, content: m.content });
            });

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin || 'http://localhost',
                        'X-Title': 'Universal AI Interface'
                    },
                    body: JSON.stringify({
                        model: state.model,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `API Error HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(l => l.trim() !== '');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                const token = parsed.choices?.[0]?.delta?.content || '';
                                fullContent += token;
                                activeChat.messages[aiMessageIndex].content = fullContent;
                                targetElement.innerHTML = marked.parse(fullContent);
                                scrollToBottom();
                            } catch (err) {
                                // Ignore json parse errors for incomplete chunks
                            }
                        }
                    }
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                const errorMsg = `\n\n**Error:** ${err.message || 'Failed to generate response.'}`;
                activeChat.messages[aiMessageIndex].content += errorMsg;
                targetElement.innerHTML = marked.parse(activeChat.messages[aiMessageIndex].content);
            } finally {
                state.isGenerating = false;
                toggleSendButtonState(false);
                saveLocalStorage();
            }
        }

        function toggleSendButtonState(disabled) {
            const btn = document.getElementById('send-btn');
            btn.disabled = disabled;
            btn.innerHTML = disabled 
                ? '<i class="fa-solid fa-spinner fa-spin text-sm"></i>' 
                : '<i class="fa-solid fa-paper-plane text-sm"></i>';
        }

        // Sanitization Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
